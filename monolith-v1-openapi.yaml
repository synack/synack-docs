  # V1 API - Vulnerability Statuses
  /v1/vulnerability_statuses:
    get:
      operationId: getVulnerabilityStatuses
      summary: Get vulnerability statuses
      description: Retrieve a list of available vulnerability statuses
      tags:
        - Vulnerability Statuses
      responses:
        '200':
          description: Vulnerability statuses retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                    description:
                      type: string
        '401':
          description: Unauthorized

          
  "/v1/assessment_tags":
    get:
      summary: Retrieve a list of assessments tags
      description: Retrieve all assessments tags defined by your organization including the number of assessments they are associated with.
      tags:
        - Tags
      responses:
        '200':
          description: A list of organization's assessments tags
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      format: int64
                    name:
                      type: string
                      description: custom assessment tag
                    count:
                      type: integer
                      format: int64
                      description: number of assessments the tag is associated with
                  required:
                    - id
                    - name
                    - count
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/errors"
        '404':
          description: Not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/errors"

    post:
      summary: Create a new assessment tag
      description: Create a new tag and associate it with an assessment. Only organization admins are able to create new tags.
      tags:
        - Tags
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Name of the tag
                assessment_id:
                  type: string
                  description: ID of the assessment to tag
              required:
                - name
                - assessment_id
      responses:
        '201':
          description: The newly created tag
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    format: int64
                  name:
                    type: string
                    description: custom assessment tag
                required:
                  - id
                  - name
        '400':
          description: Tag name is missing or is invalid (e.g. exists already)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/errors"
        '404':
          description: Requesting party is missing admin privileges or assessment not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/errors"
        '422':
          description: Tag creation failed unexpectedly
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/errors"

  "/v1/assessment_tags/{id}":
    put:
      summary: Update the name of an assessment tag record
      description: Update the name of a tag. Only organization admins are able to update tags.
      tags:
        - Tags
      parameters:
        - name: id
          in: path
          description: ID of the assessment tag
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: The new name of the tag
              required:
                - name
      responses:
        '200':
          description: The updated assessment tag record
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    format: int64
                  name:
                    type: string
                    description: custom assessment tag
                required:
                  - id
                  - name
        '400':
          description: Missing required request parameters
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/errors"
        '404':
          description: Requesting party is missing admin privileges or no tag corresponding to the given ID was found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/errors"
        '422':
          description: Tag update failed unexpectedly (an array of error messages is returned in the response)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/errors"

    delete:
      summary: Remove an assessment tag record
      description: Remove a tag. Only organization admins are able to delete tags.
      tags:
        - Tags
      parameters:
        - name: id
          in: path
          description: ID of the assessment tag
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Tag was successfully removed
        '404':
          description: Requesting party is missing admin privileges or no tag corresponding to the given ID was found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/errors"
        '422':
          description: Tag deletion failed unexpectedly
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/errors"         

  /v1/users:
    get:
      tags:
      - Users
      summary: Fetch users
      description: Fetch all organization users (members & admins). Banned users will
        not be included. Requires admin privileges.
      responses:
        "200":
          description: Successfully fetched users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      tags:
      - Users
      summary: Create a new member/admin
      description: Create a new member/admin and grant it access to assessments (if
        any). Requires admin privileges.
      requestBody:
        description: Request body.
        content:
          application/json:
            schema:
              required:
              - email
              type: object
              properties:
                email:
                  type: string
                  description: E-mail address for the user
                first_name:
                  type: string
                  description: First name of the user
                last_name:
                  type: string
                  description: Last name of the user
                admin:
                  type: boolean
                  description: Flag to indicate whether to grant admin privileges
                  default: false
                assessments:
                  type: array
                  description: IDs of assessments to grant user access to
                  items:
                    type: string
                send_invite:
                  type: boolean
                  description: Flag to indicate whether to send the user the invitation
                    URL by e-mail
                  default: true
        required: true
      responses:
        "201":
          description: The newly created user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
            application/xml:
              schema:
                $ref: '#/components/schemas/User'
        "400":
          description: "Payload includes unpermitted parameters, given assessment\
            \ IDs are invalid or user creation failed (e.g. e-mail already exists)"
          content: {}
        "403":
          description: The requesting party does not have admin privileges
          content: {}                  

  /v1/users/{id}:
    get:
      tags:
      - Users
      summary: Fetch user account
      description: Fetch information about a user account. Requires admin privileges.
      parameters:
      - name: id
        in: path
        description: ID of the user
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Successfully got users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
            application/xml:
              schema:
                $ref: '#/components/schemas/User'
        "404":
          description: No such user
          content: {}         
    put:
      tags:
      - Users
      summary: Update user account status
      description: Update existing user (reactivate and/or grant admin privileges).
        The user is automatically notified by e-mail upon account reactivation. Requires
        admin privileges.
      parameters:
      - name: id
        in: path
        description: ID of the user
        required: true
        schema:
          type: string
      - name: admin
        in: query
        description: Flag to indicate whether to grant/remove admin privileges
        schema:
          type: boolean
      - name: reactivate
        in: query
        description: Flag to indicate whether to reactivate (unban) the user
        schema:
          type: boolean
      responses:
        "200":
          description: The updated created user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
            application/xml:
              schema:
                $ref: '#/components/schemas/User'
        "400":
          description: Payload includes unpermitted parameters
          content: {}
        "403":
          description: The requesting party does not have admin privileges
          content: {}
        "404":
          description: No such user
          content: {}
    delete:
      tags:
      - Users
      summary: Ban/delete user
      description: Ban/delete a user account. Requires admin privileges.
      parameters:
      - name: id
        in: path
        description: ID of the user
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Successfully banned user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
            application/xml:
              schema:
                $ref: '#/components/schemas/User'
        "403":
          description: The requesting party does not have admin privileges
          content: {}
        "404":
          description: No such user
          content: {}          

